    <text x="60" y="21" font-family="Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#6ee7ff" text-anchor="middle">18</text>
    <text x="60" y="42" font-family="Segoe UI, sans-serif" font-size="12" fill="#9aa2b1" text-anchor="middle">серверів</text>
  </g>
  <g transform="translate(1146,52)">
    <rect x="0" y="0" width="120" height="52" rx="12" fill="#bf5af2" opacity="0.14" stroke="#bf5af2" stroke-width="2"/>
    <text x="60" y="21" font-family="Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#d8b4fe" text-anchor="middle">Ctrl+P</text>
    <text x="60" y="42" font-family="Segoe UI, sans-serif" font-size="12" fill="#9aa2b1" text-anchor="middle">палітра</text>
  </g>
  <g transform="translate(1010,116)">
    <rect x="0" y="0" width="120" height="52" rx="12" fill="#30d158" opacity="0.13" stroke="#30d158" stroke-width="2"/>
    <text x="60" y="21" font-family="Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#7ee787" text-anchor="middle">SSH · RDP</text>
    <text x="60" y="42" font-family="Segoe UI, sans-serif" font-size="12" fill="#9aa2b1" text-anchor="middle">протоколи</text>
  </g>
  <g transform="translate(1146,116)">
    <rect x="0" y="0" width="120" height="52" rx="12" fill="#ffd60a" opacity="0.13" stroke="#ffd60a" stroke-width="2"/>
    <text x="60" y="21" font-family="Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#ffe14a" text-anchor="middle">v0.1.77</text>
    <text x="60" y="42" font-family="Segoe UI, sans-serif" font-size="12" fill="#9aa2b1" text-anchor="middle">release</text>
  </g>

  <path d="M0 322 Q64 310 128 320 T256 320 T384 320 T512 320 T640 320 T768 320 T896 320 T1024 320 T1152 320 T1280 320" fill="none" stroke="url(#brand)" stroke-width="2" opacity="0.4"/>
