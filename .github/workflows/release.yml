name: RDM Cross-Platform Release

# Кроссплатформенні збірки RDM Manager (Windows/Linux/macOS) — артефакти
# прив'язуються до GitHub-релізу того ж тега.
# RDP працює лише на Windows; SSH/SFTP/vault — усюду.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (NSIS + MSI + portable)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 20
        cache: npm

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

    - name: Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

    - name: Install frontend dependencies
      run: npm ci

    - name: Build installers
      run: npm run tauri build

    - name: Build portable ZIP
      shell: pwsh
      run: |
        $conf = Get-Content "src-tauri\tauri.conf.json" -Raw | ConvertFrom-Json
        $version = $conf.version
        $appName = $conf.productName
        $portableDir = "dist-portable\$appName Portable"
        New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
        Copy-Item "src-tauri\target\release\rdm-manager.exe" "$portableDir\" -Force
        if (Test-Path "src-tauri\target\release\WebView2Loader.dll") {
          Copy-Item "src-tauri\target\release\WebView2Loader.dll" "$portableDir\" -Force
        } elseif (Test-Path "src-tauri\WebView2Loader.dll") {
          Copy-Item "src-tauri\WebView2Loader.dll" "$portableDir\" -Force
        }
        Compress-Archive -Path "$portableDir\*" -DestinationPath "dist-portable\$appName v${version} Portable.zip" -Force

    - name: Attach Windows artifacts to release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        files: |
          src-tauri/target/release/bundle/nsis/*.exe
          src-tauri/target/release/bundle/msi/*.msi
          dist-portable/*.zip

  build-linux:
    name: Build Linux (deb + AppImage)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 20
        cache: npm

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

    - name: Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

    - name: Install frontend dependencies
      run: npm ci

    - name: Build bundles
      run: npm run tauri build -- --config src-tauri/tauri.linux.conf.json

    - name: Attach Linux artifacts to release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        files: |
          src-tauri/target/release/bundle/deb/*.deb
          src-tauri/target/release/bundle/appimage/*.AppImage

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 20
        cache: npm

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

    - name: Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

    - name: Install frontend dependencies
      run: npm ci

    - name: Build bundles
      run: npm run tauri build -- --config src-tauri/tauri.macos.conf.json

    - name: Attach macOS artifacts to release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        files: |
          src-tauri/target/release/bundle/macos/*.app
          src-tauri/target/release/bundle/dmg/*.dmg
