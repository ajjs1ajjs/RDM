name: RDM Cross-Platform Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (NSIS + portable)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 20
        cache: npm

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

    - name: Install Tauri CLI
      run: cargo install tauri-cli --version ^2 --locked

    - name: Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

    - name: Install frontend dependencies
      run: npm ci

    - name: Clean Rust build artifacts
      run: cargo clean --manifest-path src-tauri/Cargo.toml

    - name: Build installers
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      run: npm run tauri build

    - name: Build portable ZIP
      shell: pwsh
      run: |
        $conf = Get-Content "src-tauri\tauri.conf.json" -Raw | ConvertFrom-Json
        $version = $conf.version
        $appName = $conf.productName
        $portableDir = "dist-portable\$appName Portable"
        New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
        Copy-Item "src-tauri\target\release\rdm-manager.exe" "$portableDir\" -Force
        # Copy WebView2Loader.dll if present in build output
        if (Test-Path "src-tauri\target\release\WebView2Loader.dll") {
          Copy-Item "src-tauri\target\release\WebView2Loader.dll" "$portableDir\" -Force
        } elseif (Test-Path "src-tauri\WebView2Loader.dll") {
          Copy-Item "src-tauri\WebView2Loader.dll" "$portableDir\" -Force
        }
        # If still not found, download it
        if (-not (Test-Path "$portableDir\WebView2Loader.dll")) {
          Write-Host "Downloading WebView2Loader.dll..."
          $wc = New-Object System.Net.WebClient
          $wc.DownloadFile("https://github.com/tauri-apps/wry/raw/main/wry-webview2/src/WebView2Loader.dll", "$portableDir\WebView2Loader.dll")
        }
        Compress-Archive -Path "$portableDir\*" -DestinationPath "dist-portable\$appName v${version} Portable.zip" -Force

    - name: Generate updater latest.json fragment
      shell: pwsh
      run: node scripts/make-latest-fragment.mjs windows-x86_64 src-tauri/target/release/bundle/nsis latest-fragment-windows.json

    - name: Upload updater fragment
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: latest-fragment-windows
        path: latest-fragment-windows.json

    - name: Attach Windows artifacts to release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        repository: ajjs1ajjs/RDM
        token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        files: |
          src-tauri/target/release/bundle/nsis/*.exe
          dist-portable/*.zip

  build-linux:
    name: Build Linux (AppImage + DEB)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 20
        cache: npm

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

    - name: Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

    - name: Install frontend dependencies
      run: npm ci

    - name: Clean Rust build artifacts
      run: cargo clean --manifest-path src-tauri/Cargo.toml

    - name: Build Linux bundles
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      run: npm run tauri build

    - name: Generate updater latest.json fragment
      run: node scripts/make-latest-fragment.mjs linux-x86_64 src-tauri/target/release/bundle/appimage latest-fragment-linux.json

    - name: Upload updater fragment
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: latest-fragment-linux
        path: latest-fragment-linux.json

    - name: Attach Linux artifacts to release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        repository: ajjs1ajjs/RDM
        token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        files: |
          src-tauri/target/release/bundle/appimage/*.AppImage
          src-tauri/target/release/bundle/deb/*.deb

  build-macos:
    name: Build macOS (${{ matrix.name }})
    runs-on: macos-14
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            name: macos-x64
            platform: darwin-x86_64
          - target: aarch64-apple-darwin
            name: macos-arm64
            platform: darwin-aarch64

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 20
        cache: npm

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        targets: ${{ matrix.target }}

    - name: Install Tauri CLI
      run: cargo install tauri-cli --version ^2 --locked

    - name: Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        key: ${{ matrix.target }}

    - name: Install frontend dependencies
      run: npm ci

    - name: Clean Rust build artifacts
      run: cargo clean --manifest-path src-tauri/Cargo.toml

    - name: Build macOS bundle
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      run: cargo tauri build --target ${{ matrix.target }} --bundles app,dmg

    - name: Generate updater latest.json fragment
      run: node scripts/make-latest-fragment.mjs ${{ matrix.platform }} src-tauri/target/${{ matrix.target }}/release/bundle/macos latest-fragment-${{ matrix.name }}.json

    - name: Upload updater fragment
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: latest-fragment-${{ matrix.name }}
        path: latest-fragment-${{ matrix.name }}.json

    - name: Attach macOS artifacts to release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        repository: ajjs1ajjs/RDM
        token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        files: |
          src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz

  publish-updater:
    name: Publish updater latest.json
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Download updater fragments
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        pattern: latest-fragment-*
        path: fragments
        merge-multiple: true

    - name: Merge fragments into latest.json
      run: |
        VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
        node scripts/merge-latest.mjs "$VERSION" latest.json fragments/latest-fragment-*.json
        cat latest.json

    - name: Attach latest.json to release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        repository: ajjs1ajjs/RDM
        token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        files: latest.json
